name: Rango · casos reales y operación de la semana

# Regenera casos.json, semana.json y mercado.json con datos de Yahoo Finance de los valores
# de tools/tickers.txt y los sube solo si los tests de Rango pasan.
# Dos trabajos: "generar" no tiene permiso de escritura (ejecuta dependencias de terceros) y
# "publicar" solo hace commit de los tres archivos generados.
on:
  schedule:
    # Sábados a las 09:17 UTC, con el mercado cerrado
    - cron: '17 9 * * 6'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generar casos
        run: |
          python -m pip install --upgrade pip
          pip install yfinance==1.8.0 pandas==3.0.5 numpy==2.5.3
          python -I tools/test_casos.py
          python tools/casos.py
          python tools/semana.py
          python tools/mercado.py

      - name: Validar contenido
        run: npm test

      - uses: actions/upload-artifact@v4
        with:
          name: contenido-generado
          path: |
            src/content/casos.json
            src/content/semana.json
            src/content/mercado.json
          if-no-files-found: error

  publicar:
    needs: generar
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: contenido-generado
          path: ${{ runner.temp }}/generado

      - name: Subir cambios
        run: |
          cp "$RUNNER_TEMP"/generado/casos.json "$RUNNER_TEMP"/generado/semana.json "$RUNNER_TEMP"/generado/mercado.json src/content/
          if git diff --quiet -- src/content/casos.json src/content/semana.json src/content/mercado.json; then
            echo "Sin cambios en casos.json, semana.json ni mercado.json"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add src/content/casos.json src/content/semana.json src/content/mercado.json
          git commit -m "Rango: actualiza casos reales, operación y mercado de la semana ($(date -u +%F))"
          git pull --rebase
          git push
